name: travel-request-agent
description: >
  出張申請を自然言語で受け付け、旅程検索・旅費規程チェック・申請書作成を
  自動で行うワークフロー型マルチエージェント。
metadata:
  authors:
    - Demo
  tags:
    - Azure AI AgentServer
    - Microsoft Agent Framework
    - Workflows
    - Travel Request
template:
  name: travel-request-agent
  kind: hosted
  protocols:
    - protocol: responses
  environment_variables:
    - name: AZURE_AI_PROJECT_ENDPOINT
      value: ${AZURE_AI_PROJECT_ENDPOINT}
    - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
      value: "{{chat}}"
    - name: FOUNDRY_HOSTED
      value: "1"
    - name: TRAVEL_PLANNER_AGENT
      value: TravelPlanner
    - name: POLICY_CHECKER_AGENT
      value: PolicyChecker
    - name: APPROVAL_AGENT
      value: ApprovalAgent
resources:
  - kind: model
    id: gpt-5.4
    name: chat
