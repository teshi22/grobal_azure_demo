name: Deploy Travel Request Agent

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME || 'travel-agent-prod' }}
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-travel-agent-hosted-demo' }}
  LOCATION: japaneast
  IMAGE_NAME: travel-agent-app
  HOSTED_AGENT_NAME: travel-request-agent
  SINGLE_PROMPT_AGENT_NAME: travel-request-single-agent
  CLARIFIER_AGENT_NAME: travel-request-clarifier
  PLANNER_AGENT_NAME: travel-request-planner
  POLICY_AGENT_NAME: travel-request-policy-narrator
  APPROVAL_AGENT_NAME: travel-request-approval-writer
  MODEL_DEPLOYMENT_NAME: ${{ vars.AZURE_AI_MODEL_DEPLOYMENT_NAME || 'gpt-5.4' }}
  EVALUATION_JUDGE_MODEL: ${{ vars.EVALUATION_JUDGE_MODEL || vars.AZURE_AI_MODEL_DEPLOYMENT_NAME || 'gpt-5.4' }}
  MODEL_CAPACITY: ${{ vars.AZURE_AI_MODEL_CAPACITY || '20' }}
  MCP_ENTRA_CLIENT_ID: ${{ vars.MCP_ENTRA_CLIENT_ID || secrets.MCP_ENTRA_CLIENT_ID }}
  WEB_ENTRA_CLIENT_ID: ${{ vars.WEB_ENTRA_CLIENT_ID || secrets.WEB_ENTRA_CLIENT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment settings
        shell: bash
        run: |
          set -euo pipefail
          : "${MCP_ENTRA_CLIENT_ID:?Set the MCP_ENTRA_CLIENT_ID repository variable or secret.}"
          : "${WEB_ENTRA_CLIENT_ID:?Set the WEB_ENTRA_CLIENT_ID repository variable or secret.}"

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Azure Developer CLI
        uses: Azure/setup-azd@v2

      - name: Install Foundry azd extensions
        shell: bash
        run: |
          set -euo pipefail
          azd extension install azure.ai.projects
          azd extension install azure.ai.agents

      - name: Deploy Azure infrastructure
        shell: bash
        run: |
          set -euo pipefail
          az group create \
            --name "$RESOURCE_GROUP" \
            --location "$LOCATION" \
            --output none

          az deployment group create \
            --name "travel-agent-${GITHUB_RUN_ID}" \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters \
              location="$LOCATION" \
              modelName="$MODEL_DEPLOYMENT_NAME" \
              modelCapacity="$MODEL_CAPACITY" \
              mcpEntraClientId="$MCP_ENTRA_CLIENT_ID" \
              webEntraClientId="$WEB_ENTRA_CLIENT_ID" \
            --query properties.outputs \
            --output json > deployment-outputs.json

          {
            echo "PROJECT_ENDPOINT=$(jq -r '.projectEndpoint.value' deployment-outputs.json)"
            echo "AZURE_AI_PROJECT_ENDPOINT=$(jq -r '.projectEndpoint.value' deployment-outputs.json)"
            echo "PROJECT_NAME=$(jq -r '.projectName.value' deployment-outputs.json)"
            echo "FOUNDRY_ACCOUNT_NAME=$(jq -r '.accountName.value' deployment-outputs.json)"
            echo "FOUNDRY_ACCOUNT_RESOURCE_ID=$(jq -r '.accountResourceId.value' deployment-outputs.json)"
            echo "FOUNDRY_PROJECT_RESOURCE_ID=$(jq -r '.projectResourceId.value' deployment-outputs.json)"
            echo "COSMOS_ENDPOINT=$(jq -r '.cosmosEndpoint.value' deployment-outputs.json)"
            echo "COSMOS_ACCOUNT_NAME=$(jq -r '.cosmosAccountName.value' deployment-outputs.json)"
            echo "COSMOS_DATABASE=$(jq -r '.cosmosDatabaseName.value' deployment-outputs.json)"
            echo "COSMOS_EVALUATION_CASE_CONTAINER=$(jq -r '.cosmosEvaluationCaseContainerName.value' deployment-outputs.json)"
            echo "COSMOS_EVALUATION_RUN_CONTAINER=$(jq -r '.cosmosEvaluationRunContainerName.value' deployment-outputs.json)"
            echo "COSMOS_EVALUATION_RESULT_CONTAINER=$(jq -r '.cosmosEvaluationResultContainerName.value' deployment-outputs.json)"
            echo "APPLICATIONINSIGHTS_CONNECTION_STRING=$(jq -r '.appInsightsConnectionString.value' deployment-outputs.json)"
            echo "APP_INSIGHTS_RESOURCE_ID=$(jq -r '.appInsightsResourceId.value' deployment-outputs.json)"
            echo "ACR_NAME=$(jq -r '.acrName.value' deployment-outputs.json)"
            echo "ACR_LOGIN_SERVER=$(jq -r '.acrLoginServer.value' deployment-outputs.json)"
            echo "ACR_RESOURCE_ID=$(az acr show --name "$(jq -r '.acrName.value' deployment-outputs.json)" --resource-group "$RESOURCE_GROUP" --query id --output tsv)"
            echo "APP_URL=$(jq -r '.appUrl.value' deployment-outputs.json)"
            echo "MCP_TOOL_ENDPOINT=$(jq -r '.mcpEndpoint.value' deployment-outputs.json)"
            echo "FUNCTION_APP_NAME=$(jq -r '.functionAppName.value' deployment-outputs.json)"
            echo "FUNCTION_STORAGE_ACCOUNT=$(jq -r '.funcStorageAccountName.value' deployment-outputs.json)"
            echo "CONTAINER_APP_NAME=$(jq -r '.appName.value' deployment-outputs.json)"
          } >> "$GITHUB_ENV"

      - name: Register Easy Auth callback
        shell: bash
        run: |
          set -euo pipefail
          app_url=$(jq -r '.appUrl.value' deployment-outputs.json)
          for client_id in "$MCP_ENTRA_CLIENT_ID" "$WEB_ENTRA_CLIENT_ID"; do
            if [[ -z "$(az ad sp list \
              --filter "appId eq '${client_id}'" \
              --query '[0].id' \
              --output tsv)" ]]; then
              az ad sp create --id "$client_id" --output none
            fi
          done
          az ad app update \
            --id "$WEB_ENTRA_CLIENT_ID" \
            --identifier-uris "api://${WEB_ENTRA_CLIENT_ID}" \
            --web-redirect-uris "${app_url}/.auth/login/aad/callback" \
            --enable-id-token-issuance true \
            --output none

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure deployment principal access
        shell: bash
        env:
          DEPLOY_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          set -euo pipefail
          storage_id=$(az storage account show \
            --name "$FUNCTION_STORAGE_ACCOUNT" \
            --resource-group "$RESOURCE_GROUP" \
            --query id \
            --output tsv)
          deploy_principal_id=$(az ad sp show \
            --id "$DEPLOY_CLIENT_ID" \
            --query id \
            --output tsv)
          for role_scope in \
            "Foundry Project Manager|$FOUNDRY_PROJECT_RESOURCE_ID" \
            "Storage Blob Data Contributor|$storage_id" \
            "AcrPush|$ACR_RESOURCE_ID"; do
            role="${role_scope%%|*}"
            scope="${role_scope#*|}"
            if [[ -z "$(az role assignment list \
              --assignee-object-id "$deploy_principal_id" \
              --role "$role" \
              --scope "$scope" \
              --query '[0].id' \
              --output tsv)" ]]; then
              az role assignment create \
                --assignee-object-id "$deploy_principal_id" \
                --assignee-principal-type ServicePrincipal \
                --role "$role" \
                --scope "$scope" \
                --output none
            fi
          done

      - name: Synchronize versioned Prompt Agents
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install \
            --quiet \
            "azure-ai-projects>=2.3.0,<2.4.0" \
            "azure-identity>=1.19.0"
          versions_file="$RUNNER_TEMP/prompt-agent-versions.json"
          for attempt in {1..12}; do
            if python scripts/deploy-prompt-agents.py \
              --project-endpoint "$PROJECT_ENDPOINT" \
              --model "$MODEL_DEPLOYMENT_NAME" \
              --output "$versions_file" \
              >/dev/null; then
              break
            fi
            if [[ "$attempt" -eq 12 ]]; then
              echo "Foundry RBAC did not become effective in time." >&2
              exit 1
            fi
            sleep 10
          done

          {
            for agent_name_var in \
              CLARIFIER_AGENT_NAME \
              PLANNER_AGENT_NAME \
              POLICY_AGENT_NAME \
              APPROVAL_AGENT_NAME \
              SINGLE_PROMPT_AGENT_NAME; do
              agent_name="${!agent_name_var}"
              version=$(jq -er --arg name "$agent_name" '.[$name]' "$versions_file")
              if [[ "$version" == "latest" ]]; then
                echo "${agent_name} resolved to mutable version 'latest'." >&2
                exit 1
              fi
              version_var="${agent_name_var%_NAME}_VERSION"
              echo "${version_var}=${version}"
            done
          } >> "$GITHUB_ENV"

      - name: Build MCP Functions package
        shell: bash
        run: |
          set -euo pipefail
          deploy_dir="$RUNNER_TEMP/mcp-deploy"
          mkdir -p "$deploy_dir"
          cp mcp-tools/function_app.py mcp-tools/host.json "$deploy_dir/"
          cp -R mcp-tools/tools "$deploy_dir/"
          python -m pip install \
            --quiet \
            --requirement mcp-tools/requirements.txt \
            --target "$deploy_dir/.python_packages/lib/site-packages"
          (cd "$deploy_dir" && zip -qr "$RUNNER_TEMP/mcp-deploy.zip" .)

      - name: Deploy MCP Functions package
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if az storage blob upload \
              --account-name "$FUNCTION_STORAGE_ACCOUNT" \
              --container-name function-releases \
              --file "$RUNNER_TEMP/mcp-deploy.zip" \
              --name mcp-deploy.zip \
              --overwrite \
              --auth-mode login \
              --output none; then
              break
            fi
            if [[ "$attempt" -eq 12 ]]; then
              echo "Storage RBAC did not become effective in time." >&2
              exit 1
            fi
            sleep 10
          done

          az functionapp restart \
            --name "$FUNCTION_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --output none

      - name: Configure azd environment
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          azd auth login \
            --client-id "$AZURE_CLIENT_ID" \
            --tenant-id "$AZURE_TENANT_ID" \
            --federated-credential-provider github
          if ! azd env select "$AZURE_ENV_NAME" --no-prompt >/dev/null 2>&1; then
            azd env new "$AZURE_ENV_NAME" --no-prompt
          fi
          azd env set AZURE_SUBSCRIPTION_ID "$AZURE_SUBSCRIPTION_ID"
          azd env set AZURE_RESOURCE_GROUP "$RESOURCE_GROUP"
          azd env set AZURE_LOCATION "$LOCATION"
          azd env set AZURE_AI_PROJECT_NAME "$PROJECT_NAME"
          azd env set AZURE_AI_PROJECT_ID "$FOUNDRY_PROJECT_RESOURCE_ID"
          azd env set AZURE_AI_PROJECT_ENDPOINT "$PROJECT_ENDPOINT"
          azd env set AZURE_CONTAINER_REGISTRY_ENDPOINT "$ACR_LOGIN_SERVER"
          azd env set AZURE_CONTAINER_REGISTRY_RESOURCE_ID "$ACR_RESOURCE_ID"
          azd env set FOUNDRY_PROJECT_ENDPOINT "$PROJECT_ENDPOINT"
          azd env set AZURE_AI_MODEL_DEPLOYMENT_NAME "$MODEL_DEPLOYMENT_NAME"
          azd env set CLARIFIER_AGENT_NAME "$CLARIFIER_AGENT_NAME"
          azd env set CLARIFIER_AGENT_VERSION "$CLARIFIER_AGENT_VERSION"
          azd env set PLANNER_AGENT_NAME "$PLANNER_AGENT_NAME"
          azd env set PLANNER_AGENT_VERSION "$PLANNER_AGENT_VERSION"
          azd env set POLICY_AGENT_NAME "$POLICY_AGENT_NAME"
          azd env set POLICY_AGENT_VERSION "$POLICY_AGENT_VERSION"
          azd env set APPROVAL_AGENT_NAME "$APPROVAL_AGENT_NAME"
          azd env set APPROVAL_AGENT_VERSION "$APPROVAL_AGENT_VERSION"
          azd env set MCP_TOOL_ENDPOINT "$MCP_TOOL_ENDPOINT"
          azd env set MCP_FUNCTION_APP_CLIENT_ID "$MCP_ENTRA_CLIENT_ID"
          azd env set COSMOS_ENDPOINT "$COSMOS_ENDPOINT"
          azd env set COSMOS_DATABASE_NAME "$COSMOS_DATABASE"
          azd env set COSMOS_CHECKPOINT_CONTAINER "workflow-checkpoints"

      - name: Deploy Foundry Hosted Agent
        shell: bash
        run: |
          set -euo pipefail
          azd deploy "$HOSTED_AGENT_NAME" --no-prompt

      - name: Resolve Hosted Agent version
        shell: bash
        run: |
          set -euo pipefail
          hosted_agent_version=""
          for attempt in {1..30}; do
            agent_json=$(azd ai agent show "$HOSTED_AGENT_NAME" \
              --output json \
              --no-prompt 2>/dev/null || true)
            hosted_agent_version=$(jq -r '.version // empty' <<<"$agent_json")
            hosted_agent_status=$(jq -r '.status // empty' <<<"$agent_json")
            if [[ -n "$hosted_agent_version" && "$hosted_agent_status" == "active" ]]; then
              break
            fi
            if [[ "$hosted_agent_status" == "failed" ]]; then
              echo "Hosted Agent version ${hosted_agent_version} failed to activate." >&2
              exit 1
            fi
            sleep 10
          done
          if [[ -z "$hosted_agent_version" \
            || "$hosted_agent_version" == "latest" \
            || "$hosted_agent_status" != "active" ]]; then
            echo "Could not resolve an immutable Hosted Agent version." >&2
            exit 1
          fi
          echo "HOSTED_AGENT_VERSION=${hosted_agent_version}" >> "$GITHUB_ENV"

      - name: Build and deploy BFF container
        shell: bash
        env:
          ENTRA_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          set -euo pipefail
          image_tag="${IMAGE_NAME}:${GITHUB_SHA}"
          build_context="$RUNNER_TEMP/app-build"
          mkdir -p "$build_context/backend" "$build_context/frontend"
          cp app/Dockerfile "$build_context/"
          cp app/backend/requirements.txt "$build_context/backend/"
          cp -R app/backend/app app/backend/config "$build_context/backend/"
          cp \
            app/frontend/package.json \
            app/frontend/package-lock.json \
            app/frontend/next.config.js \
            app/frontend/postcss.config.mjs \
            app/frontend/tsconfig.json \
            app/frontend/next-env.d.ts \
            "$build_context/frontend/"
          cp -R app/frontend/src "$build_context/frontend/"
          cat infra/bff-runtime-constraints.txt \
            >> "$build_context/backend/requirements.txt"
          az acr build \
            --registry "$ACR_NAME" \
            --image "$image_tag" \
            --file "$build_context/Dockerfile" \
            "$build_context" \
            --output none
          az containerapp registry set \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --server "$ACR_LOGIN_SERVER" \
            --identity system \
            --output none
          az containerapp ingress update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --target-port 8000 \
            --output none
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "${ACR_LOGIN_SERVER}/${image_tag}" \
            --set-env-vars \
              "AZURE_AI_MODEL_DEPLOYMENT_NAME=$MODEL_DEPLOYMENT_NAME" \
              "HOSTED_AGENT_NAME=$HOSTED_AGENT_NAME" \
              "HOSTED_AGENT_VERSION=$HOSTED_AGENT_VERSION" \
              "SINGLE_PROMPT_AGENT_NAME=$SINGLE_PROMPT_AGENT_NAME" \
              "SINGLE_PROMPT_AGENT_VERSION=$SINGLE_PROMPT_AGENT_VERSION" \
              "MCP_TOOL_ENDPOINT=$MCP_TOOL_ENDPOINT" \
              "MCP_FUNCTION_APP_CLIENT_ID=$MCP_ENTRA_CLIENT_ID" \
              "EVALUATION_JUDGE_MODEL=$EVALUATION_JUDGE_MODEL" \
              "ENTRA_TENANT_ID=$ENTRA_TENANT_ID" \
              "COSMOS_EVALUATION_CASE_CONTAINER=$COSMOS_EVALUATION_CASE_CONTAINER" \
              "COSMOS_EVALUATION_RUN_CONTAINER=$COSMOS_EVALUATION_RUN_CONTAINER" \
              "COSMOS_EVALUATION_RESULT_CONTAINER=$COSMOS_EVALUATION_RESULT_CONTAINER" \
            --output none

      - name: Configure Hosted Agent access
        shell: bash
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          bash scripts/configure-hosted-agent.sh

      - name: Seed evaluation cases
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 12 --retry-delay 10 \
            "$APP_URL/health"
          access_token=$(az account get-access-token \
            --resource "api://${WEB_ENTRA_CLIENT_ID}" \
            --query accessToken \
            --output tsv)
          seed_payload="$RUNNER_TEMP/evaluation-seed.json"
          jq -s '{cases: ., overwrite: false}' \
            evaluation-data/travel-request-cases.jsonl > "$seed_payload"
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${access_token}" \
            --header "Content-Type: application/json" \
            --data-binary "@${seed_payload}" \
            "$APP_URL/api/evaluations/cases/import" \
            --output "$RUNNER_TEMP/evaluation-seed-response.json"

      - name: Run paired evaluation smoke test
        if: ${{ vars.RUN_EVALUATION_SMOKE == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          access_token=$(az account get-access-token \
            --resource "api://${WEB_ENTRA_CLIENT_ID}" \
            --query accessToken \
            --output tsv)
          run_response="$RUNNER_TEMP/evaluation-smoke-run.json"
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${access_token}" \
            --header "Content-Type: application/json" \
            --data '{
              "name": "deployment-smoke-${{ github.run_id }}",
              "dataset_id": "travel-request-v1",
              "case_ids": [
                "case-standard-tokyo-osaka",
                "case-standard-osaka-fukuoka"
              ]
            }' \
            "$APP_URL/api/evaluations/runs" \
            --output "$run_response"
          run_id=$(jq -er '.id' "$run_response")

          run_status=""
          for attempt in {1..120}; do
            curl --fail --silent --show-error \
              --header "Authorization: Bearer ${access_token}" \
              "$APP_URL/api/evaluations/runs/${run_id}" \
              --output "$run_response"
            run_status=$(jq -r '.status // empty' "$run_response")
            case "$run_status" in
              completed|succeeded|success)
                break
                ;;
              failed|error|cancelled|canceled|partial_failure|partially_completed)
                jq '{id, status, error, scenario_runs}' "$run_response" >&2
                exit 1
                ;;
            esac
            if [[ "$attempt" -eq 120 ]]; then
              echo "Paired evaluation smoke test timed out." >&2
              exit 1
            fi
            sleep 15
          done

          jq -e \
            --arg hosted_version "$HOSTED_AGENT_VERSION" \
            --arg single_version "$SINGLE_PROMPT_AGENT_VERSION" \
            '.scenario_runs.agent_framework_workflow.agent_version == $hosted_version
             and .scenario_runs.single_prompt_agent.agent_version == $single_version' \
            "$run_response" >/dev/null

          results_response="$RUNNER_TEMP/evaluation-smoke-results.json"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${access_token}" \
            "$APP_URL/api/evaluations/runs/${run_id}/results" \
            --output "$results_response"
          jq -e '
            def comparisons:
              if type == "array" then .
              else (.results // .comparisons // .items // [])
              end;
            (comparisons | length) == 2
            and all(comparisons[];
              .scenarios.agent_framework_workflow != null
              and .scenarios.single_prompt_agent != null
              and ((.scenarios.agent_framework_workflow.error // "") == "")
              and ((.scenarios.single_prompt_agent.error // "") == "")
            )
          ' "$results_response" >/dev/null

      - name: Smoke test Hosted Agent resume
        shell: bash
        run: |
          set -euo pipefail
          python scripts/smoke-hosted-agent.py \
            --project-endpoint "$PROJECT_ENDPOINT" \
            --agent-name "$HOSTED_AGENT_NAME"
